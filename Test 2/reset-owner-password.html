<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2E2A22" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="RiceTracker" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<title>Reset Owner Password — RiceTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ricetrack.css">
<style>
  body{ display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--ink,#2E2A22); }
  .card{ max-width:420px; width:100%; background:var(--paper,#fff); border-radius:1.25rem; padding:2.5rem 2rem; text-align:center; box-shadow:0 30px 60px -15px rgba(0,0,0,0.45); font-family:'Inter',sans-serif; }
  .card h1{ font-family:'Fraunces',serif; font-size:1.35rem; margin:0 0 0.75rem; }
  .card p{ color:#6b6355; font-size:0.95rem; line-height:1.5; margin:0 0 1.5rem; }
  .status{ font-weight:600; padding:0.75rem 1rem; border-radius:0.6rem; margin-bottom:1.5rem; }
  .status.ok{ background:rgba(79,121,66,0.12); color:#3f6634; }
  a.btn{ display:inline-block; background:#4F7942; color:#fff; text-decoration:none; padding:0.7rem 1.5rem; border-radius:0.6rem; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <h1>Owner Login Reset</h1>
    <div id="status" class="status ok">Resetting…</div>
    <p>The Owner Dashboard username and password have been reset back to the defaults below.</p>
    <p><strong>Username:</strong> owner<br><strong>Password:</strong> owner123</p>
    <a class="btn" href="login.html">Go to Login</a>
  </div>
<script>
  try{
    localStorage.setItem('ricetrack_owner_auth_v1', JSON.stringify({ username: 'owner', password: 'owner123' }));
    document.getElementById('status').textContent = 'Done — owner credentials reset to the defaults.';
  }catch(e){
    document.getElementById('status').textContent = 'Could not reset automatically. Please use the browser console method instead.';
    document.getElementById('status').classList.remove('ok');
  }
</script>
<script>
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
